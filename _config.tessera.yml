# 李广明博客 — Tessera 站点配置
# 只写需要覆盖项，其余走主题默认值。文档: https://tessera.talyra42.top

# 导航栏
nav:
  logo: /img/logo.png
  display_title: true
  display_post_title: true
  fixed: true

menu:
  首页: / || fas fa-home
  归档: /archives/ || fas fa-archive
  分类: /categories/ || fas fa-folder-open
  标签: /tags/ || fas fa-tags
  友链: /friends/ || fas fa-link
  关于: /about/ || fas fa-user

# 站点图标与头像
favicon: /img/logo.png
avatar:
  img: /img/avatar.jpg
  effect: false

# 封面
cover:
  index_enable: true
  aside_enable: true
  archives_enable: true
  random_cover_dir: img/cover

# 首页开屏模块
home_top:
  enable: true
  title: 算力 · 身份 · 交付物
  subTitle: 在算力、模型与交付物之间，探寻 AI 的落地路径
  siteText: LIGUANGMING
  icons:
    - icon: fab fa-nvidia
      color: "#76b900"
    - icon: fab fa-python
      color: "#3776ab"
    - icon: fab fa-docker
      color: "#2496ed"
    - icon: fab fa-linux
      color: "#333333"
    - icon: fab fa-github
      color: "#24292e"
    - icon: fab fa-golang
      color: "#00add8"
    - icon: fab fa-rust
      color: "#ce422b"
    - icon: fab fa-js
      color: "#f0db4f"
    - icon: fab fa-c
      color: "#00599f"
    - icon: fab fa-cpp
      color: "#00599f"
    - icon: fab fa-git-alt
      color: "#f05032"
    - icon: fab fa-node-js
      color: "#68a063"
    - icon: fab fa-java
      color: "#e76f00"
    - icon: fas fa-microchip
      color: "#3b82f6"
    - icon: fas fa-bolt
      color: "#f59e0b"
    - icon: fas fa-database
      color: "#334155"
  category:
    - name: 基础设施
      path: /categories/
      icon: fas fa-server
      color: "linear-gradient(120deg, #425AEF, #7a8eff)"
    - name: 系统集成
      path: /categories/
      icon: fas fa-network-wired
      color: "linear-gradient(120deg, #f65c2c, #ff9a52)"
    - name: 系统运维
      path: /categories/
      icon: fas fa-wrench
      color: "linear-gradient(120deg, #0fb6a5, #4cd9b0)"
  banner:
    enable: false

# 搜索（本地搜索，需 hexo-generator-searchdb，生成 search.xml）
search:
  use: local_search
  placeholder: 搜索文章…
  local_search:
    preload: true
    top_n_per_article: 3
# 评论：Giscus（GitHub 登录留言，评论存为仓库 issue）
comments:
  use: Giscus
  text: true
  lazyload: false
  count: false

giscus:
  repo: bsligm/blog-giscus
  repo_id: R_kgDOV1NODA
  category_id: DIC_kwDOV1NODM4DLkCW
  light_theme: light
  dark_theme: dark

# 社交
social:
  fab fa-github: https://github.com/opsbsligm || GitHub

# 代码块
code_blocks:
  theme: darker
  macStyle: false
  word_wrap: false
  copy: true
  language: true
  shrink: false

# 字数统计与阅读时长（hexo-wordcount）
wordcount:
  enable: true
  post_wordcount: true
  min2read: true

# 文章内目录
toc:
  post: true
  number: true

# 页脚版权
footer:
  owner:
    enable: true
    since: 2021

